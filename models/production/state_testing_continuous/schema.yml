version: 2

sources:
  - name: state_testing
    description: Raw tables for state testing data
    schema: state_testing
    tables:
      - name: state_testing_continuous
        description: Continuous state testing data
        tests:
          - not_null:
              column_name: studentidentifier  # Ensure this column is non-null
          - not_null:
              column_name: student_number  # Ensure this column is non-null
          - state_testing_continuous_schoolname_values: {}  # Custom test for schoolname values
      
      
      - name: state_testing_2324
        description: State testing data for the 2023-2024 school year

      - name: state_testing_continuous_25_26
        identifier: state_testing_continuous_25-26
        description: State testing continuous data for 2025-26 school year

  - name: dbt_historical
    description: Historical tables in dbt_historical dataset
    schema: dbt_historical
    tables:
      - name: state_testing_continuous_24_25
        identifier: state_testing_continuous_24-25
        description: State testing continuous data for 2024-25 school year

#Defined in source.yml for testing purposes of the table
  # - name: views
  #   description: Views for student-to-teacher relationships
  #   schema: views
  #   tables:
  #     - name: student_to_teacher
  #       description: Mapping of students to their teachers


  - name: state_testing_continuous_test
    description: Stacked state testing continuous data from 24-25 and 25-26 school years

  - name: state_testing_continuous_ica
    description: ICA subset of state_testing_continuous_25-26 for main; filters assessmenttype LIKE 'ICA', joins student_to_teacher for grade; grade 11 math curriculum mapped to 'Algebra II'.

  - name: sbac_state_testing_tabular
    description: Subset of state testing data based on assessmenttype being summative, and join on student_to_teacher table

  - name: powerschool
    description: Powerschool data sources
    schema: powerschool
    tables:
      - name: knight_time_intervention_grade_11_2025
        description: List of grade 11 students for intervention in 2024-2025

models:
  - name: cast_state_testing_tabular
    description: CAST summative tabular view (24-25 live + historical snapshot-only, 25-26 roster-driven).
    columns:
      - name: year
        tests:
          - not_null
          - accepted_values:
              values: ['24-25', '25-26']
      - name: hit_tutoring
        description: HIT tutoring flag from student_to_teacher (NULL on historical snapshot-only rows).

  - name: sbac_state_testing_tabular
    description: SBAC ELA/Math summative tabular view with prior-year metrics.
    columns:
      - name: year
        tests:
          - not_null
          - accepted_values:
              values: ['24-25', '25-26']
      - name: hit_tutoring
        description: HIT tutoring flag from student_to_teacher (NULL on historical snapshot-only rows).

  - name: elpac_tabular
    description: >
      One row per 25-26 Summative ELPAC or Summative Alternate ELPAC result. Prior-year 24-25
      same-track scores joined on student_number. Roster fields from student_to_teacher (25-26).
      ELPI level/rank, eligibility, and Advanced ELPI per CA reporting rules.
    columns:
      - name: year
        description: School year from student_to_teacher (25-26).
      - name: elpac_track
        description: "Assessment track: elpac (Summative ELPAC) or alternate (Summative Alternate ELPAC)."
      - name: elpi_eligible
        description: >
          1 when same-track Summative ELPAC/Alternate exists in both 25-26 and 24-25; 0 when
          prior-year result is missing (not in ELPI denominator).
      - name: elpi_level
        description: >
          Current-year ELPI level (1, 2L, 2H, 3L, 3H, 4 for Summative ELPAC; 1-3 for Alternate).
          Uses roster grade_level and current scale score.
      - name: prev_year_elpi_level
        description: Prior-year ELPI level using gradelevelwhenassessed from the 24-25 test row.
      - name: elpi_level_rank
        description: Numeric rank for current ELPI level (1-6 summative; 1-3 alternate).
      - name: prev_year_elpi_level_rank
        description: Numeric rank for prior-year ELPI level.
      - name: advanced_elpi
        description: >
          1 when student met Advanced ELPI criteria (summative rank progress or level-4 maintain;
          alternate level increase, level-3 maintain, or +10 scale score). 0 when not eligible or
          criteria not met.
      - name: hit_tutoring
        description: HIT tutoring flag from student_to_teacher (25-26).