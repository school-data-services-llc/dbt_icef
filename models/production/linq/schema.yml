version: 2

models:
  - name: student_meal_applications
    description: >
      Deduplicated LINQ meal applications: one row per student per academic year.
      When multiple applications exist, prefers the status closest to a final
      decision (Processed first, Duplicate last), then the most recent
      application_date. Excludes rows with no SIS student_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - student_id
            - academic_year
    columns:
      - name: student_id
        description: "SIS student ID (Person.Identifier in LINQ)"
        tests:
          - not_null
      - name: application_status
        description: >
          Best application status for this student-year. LINQ values include
          Processed, Reviewed, Second Review, Verification, Submitted, On Hold,
          In Progress (Incomplete), In Progress (Draft), Invalid, and Duplicate.
      - name: is_finalized
        description: "True when application_status is Processed"
      - name: eligibility_type
        description: "Eligibility determined by the application (Free, Reduced, Paid)"
      - name: application_date
        description: "Application date (parsed from LINQ ISO timestamp)"
      - name: academic_year
        description: "School year the application applies to (e.g. 2025-2026)"
        tests:
          - not_null

  - name: student_meal_application_2
    description: >
      Full 25-26 student_to_teacher roster left-joined to the best LINQ meal
      eligibility record for 2025-2026. Use as a running record of who has
      submitted or is already covered (DC / categorical) versus who still needs
      an application. When multiple LINQ rows exist, prefers Direct Certification
      / Homeless / Migrant / Foster over Meal Application, then status closest
      to a final decision, then most recent application_date. Currently hardcoded
      to roster year '25-26' and LINQ academic_year '2025-2026'.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - student_id
            - academic_year
    columns:
      - name: student_id
        description: "SIS student ID from student_to_teacher.student_number"
        tests:
          - not_null
      - name: eligibility_category
        description: >
          Eligibility pathway when a LINQ record exists: Direct Certification,
          Homeless, Migrant, Foster, or Meal Application. Null when the student
          has no LINQ meal/eligibility record for the year.
        tests:
          - accepted_values:
              values:
                - Direct Certification
                - Homeless
                - Migrant
                - Foster
                - Meal Application
              config:
                where: "eligibility_category IS NOT NULL"
      - name: eligibility_benefit_type
        description: >
          LINQ benefit type used to derive eligibility_category, such as
          Calfresh (SNAP), CalWorks, Medicaid, Medicaid Reduced, Homeless,
          Migrant, or Foster. Null for family meal applications or students
          with no LINQ record.
      - name: eligibility_type
        description: "Selected eligibility result (Free, Reduced, or Paid); null if no LINQ record"
      - name: application_status
        description: "Status of the selected LINQ record; null if no LINQ record"
      - name: is_finalized
        description: "True when application_status is Processed; null if no LINQ record"
      - name: application_date
        description: "Application or eligibility date parsed from the LINQ timestamp; null if no LINQ record"
      - name: needs_application
        description: >
          True when the student has no LINQ meal/eligibility record for the year
          (still needs to submit). False when already covered via DC/categorical
          eligibility or a family meal application.
      - name: academic_year
        description: "School year for this roster snapshot (currently always 2025-2026)"
        tests:
          - not_null

  - name: student_meals
    description: >
      Meal participation records from LINQ joined with each student's best meal
      application for the academic year (Processed preferred over Duplicate,
      then most recent). One row per student per participation date per meal type.
      Currently disabled.
    columns:
      - name: student_id
        description: "SIS student ID (Person.Identifier in LINQ); null when LINQ has no person match"
      - name: participation_date
        description: "Date the meal was served"
        tests:
          - not_null
      - name: meal_type
        description: "Serving session name (e.g. Breakfast, Lunch)"
      - name: eligibility_at_meal
        description: "Eligibility status recorded on the transaction (Free/Reduced/Paid)"
      - name: application_status
        description: "Status of the joined application (Processed, Duplicate, etc.)"
      - name: application_eligibility_type
        description: "Eligibility determined by the joined application"
