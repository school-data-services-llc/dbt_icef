version: 2

models:
  - name: student_meal_applications
    description: >
      Deduplicated LINQ meal applications: one row per student per academic year.
      When multiple applications exist, prefers the status closest to a final
      decision (Processed first, Duplicate last), then the most recent
      application_date. Excludes rows with no SIS student_id.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - student_id
            - academic_year
    columns:
      - name: student_id
        description: "SIS student ID (Person.Identifier in LINQ)"
        tests:
          - not_null
      - name: application_status
        description: >
          Best application status for this student-year. LINQ values include
          Processed, Reviewed, Second Review, Verification, Submitted, On Hold,
          In Progress (Incomplete), In Progress (Draft), Invalid, and Duplicate.
      - name: is_finalized
        description: "True when application_status is Processed"
      - name: eligibility_type
        description: "Eligibility determined by the application (Free, Reduced, Paid)"
      - name: application_date
        description: "Application date (parsed from LINQ ISO timestamp)"
      - name: academic_year
        description: "School year the application applies to (e.g. 2025-2026)"
        tests:
          - not_null

  - name: student_meal_application_2
    description: >
      Multi-year student_to_teacher roster left-joined to the best LINQ meal
      eligibility record for the matching academic year. One row per student per
      year from 25-26 onward. Use as a running record of who has submitted or is
      already covered (DC / categorical) versus who still needs an application.
      When multiple LINQ rows exist for a student-year, prefers Direct
      Certification / Homeless / Migrant / Foster over Meal Application, then
      status closest to a final decision, then most recent application_date.
      Roster year 'YY-YY' maps to academic_year '20YY-20YY'; LINQ values with
      '/' are normalized to hyphen form (e.g. 2026/2027 -> 2026-2027).
      For 2026-2027 only, when LINQ fields are blank and
      student_to_teacher.ishomeless = Yes, backfills Homeless,
      application_status = Processed, and needs_application = FALSE
      (PowerSchool catch for students LINQ may miss).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - student_id
            - academic_year
    columns:
      - name: student_id
        description: "SIS student ID from student_to_teacher.student_number"
        tests:
          - not_null
      - name: eligibility_category
        description: >
          Eligibility pathway: Direct Certification, Homeless, Migrant, Foster,
          or Meal Application from LINQ when present. For 2026-2027, may be
          backfilled to Homeless from roster ishomeless when LINQ category is
          blank. Otherwise null when no LINQ record and no PS homeless backfill.
        tests:
          - accepted_values:
              values:
                - Direct Certification
                - Homeless
                - Migrant
                - Foster
                - Meal Application
              config:
                where: "eligibility_category IS NOT NULL"
      - name: eligibility_benefit_type
        description: >
          LINQ benefit type (Calfresh/SNAP, CalWorks, Medicaid, Homeless, etc.)
          when present. For 2026-2027, backfilled to Homeless from roster
          ishomeless when LINQ benefit is blank. Null for family meal apps with
          no benefit type and no PS homeless backfill.
      - name: eligibility_type
        description: "Selected eligibility result (Free, Reduced, or Paid); null if no LINQ record"
      - name: application_status
        description: >
          Status of the selected LINQ record. For 2026-2027, backfilled to
          Processed when roster ishomeless = Yes and LINQ status is blank.
      - name: is_finalized
        description: >
          True when application_status is Processed (including PS homeless
          backfill); null when status is null
      - name: application_date
        description: "Application or eligibility date parsed from the LINQ timestamp; null if no LINQ record"
      - name: needs_application
        description: >
          True when the student has no LINQ meal/eligibility record and (for
          2026-2027) is not flagged homeless on the roster. False when covered
          via LINQ DC/categorical/meal app or PS homeless backfill.
      - name: academic_year
        description: "School year for this roster snapshot (e.g. 2025-2026, 2026-2027)"
        tests:
          - not_null

  - name: student_meals
    description: >
      Meal participation records from LINQ joined with each student's best meal
      application for the academic year (Processed preferred over Duplicate,
      then most recent). One row per student per participation date per meal type.
      Currently disabled.
    columns:
      - name: student_id
        description: "SIS student ID (Person.Identifier in LINQ); null when LINQ has no person match"
      - name: participation_date
        description: "Date the meal was served"
        tests:
          - not_null
      - name: meal_type
        description: "Serving session name (e.g. Breakfast, Lunch)"
      - name: eligibility_at_meal
        description: "Eligibility status recorded on the transaction (Free/Reduced/Paid)"
      - name: application_status
        description: "Status of the joined application (Processed, Duplicate, etc.)"
      - name: application_eligibility_type
        description: "Eligibility determined by the joined application"
