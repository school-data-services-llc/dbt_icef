version: 2

sources:
  - name: views
    description: "Existing BigQuery dataset containing views"
    tables:
      - name: student_to_teacher
        description: "Existing table for student-to-teacher mapping"
        tests:
          - not_null:
              column_name: student_number
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - student_number
                - year
                - grade_level
          - not_null:
              column_name: lastfirst

      - name: diagnostic_results_tabular
        description: >
          iReady/DIBELS diagnostic placements and DIBELS composites (BOY/MOY/EOY).
          Joined to student_to_teacher on student_number and year; adjust source schema if not in views.

  - name: enrollment
    description: "BigQuery dataset containing enrollment capacity tables"
    tables:
      - name: budgeted_enrollment_capacity
        description: >
          Budgeted enrollment and seat capacity by school/grade. Includes a year
          column (currently 26-27). Used by enrollment_demographics for the
          current school year.
      - name: budgeted_enrollment_capacity_hardcode_8_18_25
        description: >
          Frozen 25-26 budgeted enrollment / seat capacity snapshot (loaded
          ~8/18/25). Used by enrollment_demographics for prior-year YoY.
      - name: enrollment_grade_capacity
        description: >
          Static classroom / enrollment caps by school, grade, and year (26-27
          from Enrollment Summary sheet snapshot). Update directly in BigQuery
          via SQL; joined in enrollment_demographics for the capacity column.

  - name: pear
    schema: pear
    database: icef-437920
    tables:
      - name: pear_daily_updates
        description: "Daily updates for PEAR"

  - name: linq
    schema: linq
    database: icef-437920
    tables:
      - name: linq_meal_applications
        description: "Meal applications extracted from the LINQ OData API (one row per student per family application)"
      - name: linq_meal_participation
        description: "Daily meal participation records from LINQ (one row per student per date per serving session)"
      - name: UBA_Declined_Apps_2627
        identifier: UBA_Declined_Apps_2627
        description: >
          Students whose parent/guardian declined to complete the Universal Benefits
          Application for 2026-2027. Joined into student_meal_application_2 by
          Student_Number for that academic year only.

  - name: survey_monkey
    schema: survey_monkey
    database: icef-437920
    tables:
      - name: survey_questions
        description: >
          SurveyMonkey item dictionary from GET /surveys/{id}/details.
          One row per answerable item (matrix row, checkbox choice, or
          single/open-ended question). Stable ids for dbt joins.
      - name: survey_responses
        description: >
          One row per SurveyMonkey respondent (Excel metadata columns:
          respondent_id, collector_id, start/end, IP, email, name, custom data).
      - name: survey_response_items
        description: >
          One row per respondent x item. choice_id/row_id are resolved to
          Excel-style answer_text and item_label.

