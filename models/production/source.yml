version: 2

sources:
  - name: views
    description: "Existing BigQuery dataset containing views"
    tables:
      - name: student_to_teacher
        description: "Existing table for student-to-teacher mapping"
        tests:
          - not_null:
              column_name: student_number
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - student_number
                - year
                - grade_level
          - not_null:
              column_name: lastfirst

      - name: diagnostic_results_tabular
        description: >
          iReady/DIBELS diagnostic placements and DIBELS composites (BOY/MOY/EOY).
          Joined to student_to_teacher on student_number and year; adjust source schema if not in views.

  - name: enrollment
    description: "BigQuery dataset containing enrollment capacity tables"
    tables:
      - name: budgeted_enrollment_capacity
        description: >
          Budgeted enrollment and seat capacity by school/grade. Includes a year
          column (currently 26-27). Used by enrollment_demographics for the
          current school year.
      - name: budgeted_enrollment_capacity_hardcode_8_18_25
        description: >
          Frozen 25-26 budgeted enrollment / seat capacity snapshot (loaded
          ~8/18/25). Used by enrollment_demographics for prior-year YoY.

  - name: pear
    schema: pear
    database: icef-437920
    tables:
      - name: pear_daily_updates
        description: "Daily updates for PEAR"

  - name: linq
    schema: linq
    database: icef-437920
    tables:
      - name: linq_meal_applications
        description: "Meal applications extracted from the LINQ OData API (one row per student per family application)"
      - name: linq_meal_participation
        description: "Daily meal participation records from LINQ (one row per student per date per serving session)"

